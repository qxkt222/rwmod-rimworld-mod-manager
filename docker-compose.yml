# rwmod — Docker Compose (production)
# No `version:` key: Compose v2 ignores it and warns that it is obsolete.
services:
  rwmod:
    build: .
    image: rwmod:latest
    container_name: rwmod
    ports:
      - "8000:8000"
    volumes:
      # Built-in SteamCMD (host directory; SteamCMD writes logs/, steamapps/
      # and appcache/ here, so it must stay writable — no :ro)
      - ./steamcmd:/app/steamcmd
      # Mods directory — persistent
      - mods_data:/app/mods
      # Home directory (~/.rwmod, ~/.rwmod.db) and config — persistent
      - rwmod_config:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/config')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mods_data:
  rwmod_config:
