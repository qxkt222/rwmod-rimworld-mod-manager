# Every hook rev below tracks the version pinned in uv.lock (the dev group is
# what `uv sync` installs and what CI runs). Keeping them equal means a local
# `pre-commit run` and the gate agree on the rule set — a newer ruff hook used
# to flag code that `uv run ruff` accepted, and vice versa.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.0
    hooks:
      - id: codespell
        args:
          - --skip=*.json,*.lock,*.svg,package-lock.json
          - --ignore-words=.codespell-allow

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: [-c, pyproject.toml, -ll]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.0
    hooks:
      - id: mypy
        args: [--config-file=pyproject.toml, src/rwmod]
        additional_dependencies: [pydantic, fastapi, typer, uvicorn, websockets, python-multipart, types-defusedxml]
        pass_filenames: false

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: mixed-line-ending
        args: [--fix=lf]
